[workspace]
resolver = "3"
members = [
    "crates/sagax-core",
    "crates/sagax-nav",
    "crates/sagax-decide",
    "crates/sagax-debug",
    "crates/sagax-ffi",
    "crates/sagax-wasm",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/STARSCrazy/sagax"
keywords = ["pathfinding", "astar", "gamedev", "hex-grid", "game-ai"]
categories = ["game-development", "algorithms", "wasm"]
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
codegen-units = 1
lto = "thin"
